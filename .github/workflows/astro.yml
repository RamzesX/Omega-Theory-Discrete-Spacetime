name: Deploy Astro Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Force all JavaScript actions in this workflow to run on Node 24.
# Node 20 actions are deprecated by GitHub: default switch to Node 24 is
# June 2 2026 and Node 20 is removed from runners Sept 16 2026.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# Every action we pin below (v6 / v5) already runs on Node 24 natively, but
# this belt-and-braces flag silences the "Node 20 actions are deprecated"
# warning if a transitive composite action happens to still reference Node 20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # Auto-enable Pages on the repo if it's been disabled / not yet
          # configured. Prevents the Setup-Pages step from fast-failing with
          # `Get Pages site failed ... Not Found` when Pages source has been
          # reset (observed 2026-05-04, runs 25344924228 / 25345318884 /
          # 25346455224 — all 17–22 s fast-fails).
          enablement: true

      - name: Install dependencies
        working-directory: ./site
        run: npm ci

      - name: Copy and prepare papers content
        working-directory: ./site
        run: node scripts/copy-content.js

      - name: Build with Astro
        working-directory: ./site
        run: npm run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_URL: ${{ steps.pages.outputs.base_path }}

      - name: Audit dist/ for deploy-breaking regressions
        working-directory: ./site
        run: node scripts/audit-dist.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/dist
          # v5 changed the default: hidden files are now EXCLUDED unless this
          # is true. We MUST include dotfiles — `.nojekyll` is what tells
          # GitHub Pages to skip Jekyll processing of our `_astro/` directory.
          # Without it, every CSS/JS asset 404s post-deploy.
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
