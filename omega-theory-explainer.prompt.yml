      As of 2026-04-21 the Lean project has 8,996 machine-checked theorems, 0 sorry, 8 axioms.

  - question: "What is the fourth irrational?"
    expected: |
      Beyond π, e and √2 (which generate the three SM fermion generations via their residual
      δ-error ordering), Omega-Theory's cycle-43 capstone introduces Catalan's constant G as
      a fourth irrational channel. Its role is to carry a sterile-neutrino / dark-matter
