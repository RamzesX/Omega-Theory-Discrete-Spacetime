      like a 4D grid. All particles try to move at light speed, but massive particles must
      "pay a toll" by reshaping the geometry around them - this toll IS mass.

  - question: "What makes this theory different from String Theory?"
    expected: |
      Unlike String Theory which has few falsifiable predictions, Omega-Theory makes concrete
      testable predictions. The key one - that quantum error rates follow T^(-2.5) power law
      rather than Arrhenius exponential - was confirmed by Diraq's 2024 experiments.

  - question: "What is the Fourth Noether Law?"
    expected: |
      The Fourth Noether Law states that information is conserved: the divergence of the
      information current is zero. This is mathematically expressed as a continuity equation
      and has been formally verified in Lean 4. It explains why time travel is impossible -
      it would violate information conservation.

